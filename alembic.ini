[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Deliberately empty: migrations/env.py reads DATABASE_ADMIN_URL from the
# environment so a DSN is never committed to the repo.
sqlalchemy.url =

# Zero-padded numeric prefixes keep the migration list readable in order.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
